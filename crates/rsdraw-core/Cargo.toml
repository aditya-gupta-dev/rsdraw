[package]
name = "rsdraw-core"
version = "0.1.0"
edition = "2021"
description = "Native Excalidraw-compatible geometry and Cairo/Pango rendering"

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
pango = { version = "0.22", features = ["v1_50"] }
pangocairo = "0.22"
ryu-js = "1.0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
